<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compass IPS - About Us</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #121019;
            --bg-card: #1b1724;
            --gold-accent: #e5c158;
            --purple-accent: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2d2640;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background-color: var(--bg-main);
            position: relative;
        }

        .back-arrow {
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: none;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 17px;
            font-weight: 500;
            color: var(--gold-accent);
        }

        /* Main Content List Container */
        .main-container {
            flex: 1;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 15px;
            border-bottom: 1px solid rgba(45, 38, 64, 0.4);
            transition: background 0.2s;
        }

        .menu-item:active {
            background-color: var(--bg-card);
        }

        .menu-item i {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Draggable Floating Customer Service Icon */
        .floating-support {
            position: fixed;
            right: 16px;
            bottom: 100px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid rgba(168, 85, 247, 0.4);
            cursor: grab;
            touch-action: none;
        }

        .floating-support:active {
            cursor: grabbing;
        }

        .floating-support .help {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* Draggable Floating Card Image Graphic */
        .floating-gold-card {
            position: fixed;
            right: 16px;
            bottom: 165px;
            width: 45px;
            height: 55px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            cursor: grab;
            touch-action: none;
        }

        .floating-gold-card:active {
            cursor: grabbing;
        }

        .gold-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Top Header Bar -->
    <header class="top-header">
        <a href="index.html" class="back-arrow"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="header-title">About Us</div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <a href="job-salary.html" class="menu-item">
            <span>Job and salary information for Connection IPS (CIPS)</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="company-about.html" class="menu-item">
            <span>about Us</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
    </main>

    <!-- Draggable Floating Customer Service Icon -->
    <div class="floating-support" id="draggableSupport">
        <img src="customer.png" alt="support" class="help" onerror="this.src='customer.png'">
    </div>

    <!-- Draggable Floating Card Image Graphic -->
    <div class="floating-gold-card" id="draggableGoldCard">
        <img src="jadu.jpg" alt="gold-card" class="gold-card-img" onerror="this.src='https://i.imgur.com/4m2W66Z.png'">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Make Elements Movable (Draggable with Mouse and Touch)
            function makeDraggable(elm) {
                let initialX = 0, initialY = 0;
                elm.addEventListener('mousedown', dragStart);
                elm.addEventListener('touchstart', dragStart, { passive: false });

                function dragStart(e) {
                    e.preventDefault();
                    initialX = e.clientX || e.touches[0].clientX;
                    initialY = e.clientY || e.touches[0].clientY;

                    document.addEventListener('mousemove', drag);
                    document.addEventListener('touchmove', drag, { passive: false });
                    document.addEventListener('mouseup', dragEnd);
                    document.addEventListener('touchend', dragEnd);
                }

                function drag(e) {
                    e.preventDefault();
                    const clientX = e.clientX || e.touches[0].clientX;
                    const clientY = e.clientY || e.touches[0].clientY;

                    const dx = clientX - initialX;
                    const dy = clientY - initialY;

                    initialX = clientX;
                    initialY = clientY;

                    const rect = elm.getBoundingClientRect();
                    elm.style.right = 'auto';
                    elm.style.bottom = 'auto';
                    elm.style.left = (rect.left + dx) + 'px';
                    elm.style.top = (rect.top + dy) + 'px';
                }

                function dragEnd() {
                    document.removeEventListener('mousemove', drag);
                    document.removeEventListener('touchmove', drag);
                    document.removeEventListener('mouseup', dragEnd);
                    document.removeEventListener('touchend', dragEnd);
                }
            }

            makeDraggable(document.getElementById('draggableSupport'));
            makeDraggable(document.getElementById('draggableGoldCard'));
        });
    </script>
</body>
</html>
