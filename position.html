<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Position & VIP Tiers - Daily Math Earn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f24] text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-indigo-500 selection:text-white pb-20">

  <!-- Header -->
  <header class="bg-[#121836] border-b border-slate-800 p-4 sticky top-0 z-20 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-3 min-w-0">
        <a href="task.html" class="bg-slate-800 hover:bg-slate-700 text-white p-2.5 rounded-xl transition flex items-center justify-center shrink-0" title="Back to Tasks">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div class="truncate">
          <h1 class="font-bold text-lg leading-tight text-white truncate">Position &amp; VIP Tiers</h1>
          <p id="current-position-sub" class="text-xs text-amber-400 font-semibold truncate">Current Position: Intern (Free 3 Days)</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 bg-slate-900/90 border border-slate-700 px-3 py-1.5 rounded-full shrink-0">
        <i class="fa-solid fa-coins text-amber-400"></i>
        <span id="wallet-balance" class="font-bold text-amber-400 text-sm">Rs. 0</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-4">

    <!-- Current Position Summary Card -->
    <div class="bg-gradient-to-br from-indigo-900/60 via-[#151d42] to-[#111633] border border-indigo-500/30 rounded-3xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/30">
          Active Position
        </span>
        <span id="position-validity-badge" class="text-xs font-semibold text-emerald-400">Free Trial: 3 Days Only</span>
      </div>

      <div class="flex items-end justify-between gap-2 mt-2">
        <div>
          <div id="hero-position-name" class="text-2xl font-black text-white">Intern (VIP 0)</div>
          <div id="hero-position-cycle" class="text-xs text-slate-300 mt-0.5">Cycle: Free 3-Day Trial</div>
        </div>
        <div class="text-right">
          <div class="text-[11px] text-slate-400">Daily Net Cap</div>
          <div id="hero-daily-cap" class="text-lg font-black text-emerald-400">+Rs. 30</div>
        </div>
      </div>
    </div>

    <!-- Position Tiers List (Free 3d + VIP 1-9 Weekly/Monthly) -->
    <div id="position-tiers-list" class="space-y-3">
      <!-- Populated by JS -->
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 inset-x-0 bg-[#10152e]/95 backdrop-blur-md border-t border-slate-800 z-30">
    <div class="max-w-md mx-auto grid grid-cols-5 py-2 text-center text-[11px] font-medium">
      <a href="home.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-house text-base"></i>
        <span>Home</span>
      </a>
      <a href="position.html" class="flex flex-col items-center gap-1 text-sky-400 font-bold">
        <i class="fa-solid fa-layer-group text-base"></i>
        <span>Position</span>
      </a>
      <a href="invite.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-regular fa-gem text-base"></i>
        <span>Invite</span>
      </a>
      <a href="profit.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-gift text-base"></i>
        <span>Profit</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-user text-base"></i>
        <span>My</span>
      </a>
    </div>
  </nav>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white border border-slate-600 px-4 py-2 rounded-full shadow-2xl text-xs font-bold hidden z-50">
    Updated
  </div>

  <script>
    const FREE_MAX_DAYS = 3;

    // Balanced Cash-Flow Model (Free 3 Days Only + VIP 1-9 Weekly & Monthly)
    const VIP_TIERS = [
      { level: 0, name: "Intern (Free)", badge: "3 DAYS ONLY", weeklyCost: 0,     monthlyCost: 0,     taskCost: 0,    taskBonus: 10,   dailyTasks: 3, dailyCap: 30 },
      { level: 1, name: "VIP 1",         badge: "BRONZE",      weeklyCost: 300,   monthlyCost: 1050,  taskCost: 100,  taskBonus: 110,  dailyTasks: 3, dailyCap: 30 },
      { level: 2, name: "VIP 2",         badge: "SILVER",      weeklyCost: 600,   monthlyCost: 2100,  taskCost: 200,  taskBonus: 218,  dailyTasks: 3, dailyCap: 54 },
      { level: 3, name: "VIP 3",         badge: "GOLD",        weeklyCost: 1200,  monthlyCost: 4200,  taskCost: 400,  taskBonus: 432,  dailyTasks: 3, dailyCap: 96 },
      { level: 4, name: "VIP 4",         badge: "PLATINUM",    weeklyCost: 2000,  monthlyCost: 7000,  taskCost: 650,  taskBonus: 698,  dailyTasks: 3, dailyCap: 144 },
      { level: 5, name: "VIP 5",         badge: "DIAMOND",     weeklyCost: 3500,  monthlyCost: 12200, taskCost: 1000, taskBonus: 1070, dailyTasks: 3, dailyCap: 210 },
      { level: 6, name: "VIP 6",         badge: "ROYAL",       weeklyCost: 6000,  monthlyCost: 21000, taskCost: 1500, taskBonus: 1600, dailyTasks: 4, dailyCap: 400 },
      { level: 7, name: "VIP 7",         badge: "ELITE",       weeklyCost: 10000, monthlyCost: 35000, taskCost: 2500, taskBonus: 2650, dailyTasks: 4, dailyCap: 600 },
      { level: 8, name: "VIP 8",         badge: "MASTER",      weeklyCost: 16000, monthlyCost: 56000, taskCost: 4000, taskBonus: 4220, dailyTasks: 4, dailyCap: 880 },
      { level: 9, name: "VIP 9",         badge: "LEGEND",      weeklyCost: 25000, monthlyCost: 87500, taskCost: 6000, taskBonus: 6300, dailyTasks: 5, dailyCap: 1500 }
    ];

    let walletBalance = 0;
    let vipLevel = 0;
    let vipCycle = "free_3d";
    let vipExpiry = null;

    function addDaysToToday(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split("T")[0];
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = `fixed bottom-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full shadow-2xl text-xs font-bold z-50 border ${
        isError
          ? "bg-rose-950 text-rose-200 border-rose-500/50"
          : "bg-emerald-950 text-emerald-200 border-emerald-500/50"
      }`;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 2300);
    }

    function loadPositionState() {
      walletBalance = parseInt(localStorage.getItem("math_wallet_balance") || "0", 10);
      vipLevel = parseInt(localStorage.getItem("math_vip_level") || "0", 10);
      vipCycle = localStorage.getItem("math_vip_cycle") || (vipLevel === 0 ? "free_3d" : "weekly");
      vipExpiry = localStorage.getItem("math_vip_expiry") || null;

      updateHeaderAndHero();
      renderPositionTiers();
    }

    function updateHeaderAndHero() {
      const currentTier = VIP_TIERS.find(t => t.level === vipLevel) || VIP_TIERS[0];
      document.getElementById("wallet-balance").textContent = `Rs. ${walletBalance.toLocaleString()}`;

      if (vipLevel === 0) {
        const freeDay = parseInt(localStorage.getItem("math_free_plan_day") || "1", 10);
        document.getElementById("current-position-sub").textContent = `Current Position: Intern (Day ${freeDay}/${FREE_MAX_DAYS})`;
        document.getElementById("hero-position-name").textContent = "Intern (VIP 0)";
        document.getElementById("hero-position-cycle").textContent = `Cycle: Free Trial (${FREE_MAX_DAYS} Days Only)`;
        document.getElementById("position-validity-badge").textContent = `Day ${freeDay} of ${FREE_MAX_DAYS}`;
      } else {
        const cycleText = vipCycle === "monthly" ? "Monthly (30 Days)" : "Weekly (7 Days)";
        document.getElementById("current-position-sub").textContent = `Current Position: ${currentTier.name} (${vipCycle.toUpperCase()})`;
        document.getElementById("hero-position-name").textContent = `${currentTier.name}`;
        document.getElementById("hero-position-cycle").textContent = `Cycle: ${cycleText}`;
        document.getElementById("position-validity-badge").textContent = vipExpiry ? `Till ${vipExpiry}` : "Active";
      }

      document.getElementById("hero-daily-cap").textContent = `+Rs. ${currentTier.dailyCap.toLocaleString()}`;
    }

    function selectPosition(level, cycle) {
      const tier = VIP_TIERS.find(t => t.level === level);
      if (!tier) return;

      if (level === 0) {
        vipLevel = 0;
        vipCycle = "free_3d";
        vipExpiry = localStorage.getItem("math_free_expiry") || addDaysToToday(FREE_MAX_DAYS);
        localStorage.setItem("math_vip_level", "0");
        localStorage.setItem("math_vip_cycle", "free_3d");
        showToast("Switched position to Intern (Free 3 Days Only).");
        loadPositionState();
        return;
      }

      const chosenCycle = cycle === "monthly" ? "monthly" : "weekly";
      const cost = chosenCycle === "monthly" ? tier.monthlyCost : tier.weeklyCost;
      const days = chosenCycle === "monthly" ? 30 : 7;

      if (walletBalance < cost) {
        showToast(`Need Rs. ${cost.toLocaleString()} in wallet for ${tier.name} (${chosenCycle}).`, true);
        return;
      }

      walletBalance -= cost;
      vipLevel = tier.level;
      vipCycle = chosenCycle;
      vipExpiry = addDaysToToday(days);

      localStorage.setItem("math_wallet_balance", walletBalance.toString());
      localStorage.setItem("math_vip_level", vipLevel.toString());
      localStorage.setItem("math_vip_cycle", vipCycle);
      localStorage.setItem("math_vip_expiry", vipExpiry);

      showToast(`Position updated to ${tier.name} (${chosenCycle.toUpperCase()})!`);
      loadPositionState();
    }

    function renderPositionTiers() {
      const container = document.getElementById("position-tiers-list");
      container.innerHTML = "";

      VIP_TIERS.forEach(tier => {
        const isFree = tier.level === 0;
        const netPerTask = isFree ? tier.taskBonus : (tier.taskBonus - tier.taskCost);
        const isWeeklyActive = !isFree && tier.level === vipLevel && vipCycle === "weekly";
        const isMonthlyActive = !isFree && tier.level === vipLevel && vipCycle === "monthly";
        const isCurrent = isFree ? (vipLevel === 0) : (isWeeklyActive || isMonthlyActive);

        const card = document.createElement("div");
        card.className = `bg-[#131a3a] rounded-2xl p-4 border shadow-lg ${
          isCurrent ? "border-amber-400" : "border-slate-800"
        }`;

        if (isFree) {
          card.innerHTML = `
            <div class="flex items-center justify-between mb-2">
              <div>
                <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">${tier.badge}</span>
                <h2 class="text-base font-black text-white mt-1">${tier.name}</h2>
              </div>
              <span class="text-xs font-bold text-emerald-400">+Rs. ${tier.dailyCap}/day</span>
            </div>
            <div class="text-xs text-slate-400 mb-3">
              ${tier.dailyTasks} tasks/day &bull; Net: <strong class="text-emerald-400">+Rs. ${netPerTask}/task</strong> &bull; Valid 3 days only
            </div>
            <button
              onclick="selectPosition(0, 'free_3d')"
              class="w-full py-2.5 px-3 rounded-xl text-xs font-bold transition ${
                isCurrent
                  ? "bg-emerald-600/20 text-emerald-300 border border-emerald-500/40"
                  : "bg-slate-800 hover:bg-slate-700 text-white"
              }"
            >
              ${isCurrent ? '<i class="fa-solid fa-check mr-1"></i>Current Position (Free 3d)' : "Select Intern (Free 3 Days)"}
            </button>
          `;
        } else {
          card.innerHTML = `
            <div class="flex items-center justify-between mb-2">
              <div>
                <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">${tier.badge}</span>
                <h2 class="text-base font-black text-white mt-1">${tier.name}</h2>
              </div>
              <span class="text-xs font-bold text-indigo-300">+Rs. ${tier.dailyCap.toLocaleString()}/day</span>
            </div>

            <div class="grid grid-cols-3 gap-2 bg-slate-950/60 border border-slate-800 rounded-xl p-2.5 mb-3 text-center text-xs">
              <div>
                <div class="text-[10px] text-slate-400">Task Cost</div>
                <div class="font-bold text-rose-400">Rs. ${tier.taskCost.toLocaleString()}</div>
              </div>
              <div class="border-x border-slate-800">
                <div class="text-[10px] text-slate-400">Payout</div>
                <div class="font-bold text-emerald-400">Rs. ${tier.taskBonus.toLocaleString()}</div>
              </div>
              <div>
                <div class="text-[10px] text-slate-400">Net / Task</div>
                <div class="font-bold text-amber-300">+Rs. ${netPerTask.toLocaleString()}</div>
              </div>
            </div>

            <div class="text-[11px] text-slate-400 mb-3">
              ${tier.dailyTasks} tasks/day &bull; Balanced cash flow rotation
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button
                onclick="selectPosition(${tier.level}, 'weekly')"
                class="py-2.5 px-2.5 rounded-xl text-xs font-bold transition ${
                  isWeeklyActive
                    ? "bg-emerald-600/20 text-emerald-300 border border-emerald-500/40"
                    : "bg-indigo-600 hover:bg-indigo-500 text-white"
                }"
              >
                ${isWeeklyActive ? "Weekly Active" : `Weekly • Rs. ${tier.weeklyCost.toLocaleString()}`}
              </button>
              <button
                onclick="selectPosition(${tier.level}, 'monthly')"
                class="py-2.5 px-2.5 rounded-xl text-xs font-bold transition ${
                  isMonthlyActive
                    ? "bg-emerald-600/20 text-emerald-300 border border-emerald-500/40"
                    : "bg-amber-500 hover:bg-amber-400 text-slate-950"
                }"
              >
                ${isMonthlyActive ? "Monthly Active" : `Monthly • Rs. ${tier.monthlyCost.toLocaleString()}`}
              </button>
            </div>
          `;
        }

        container.appendChild(card);
      });
    }

    window.addEventListener("DOMContentLoaded", loadPositionState);
  </script>
</body>
</html>
